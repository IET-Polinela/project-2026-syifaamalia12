<!DOCTYPE html>
<html>
<head>
    <title>Edit Laporan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #334155;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        .btn-submit {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: #475569;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Laporan</h1>
        <p class="subtitle">Perbarui data laporan sesuai kebutuhan.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Update Laporan</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">← Kembali ke Daftar Laporan</a>
    </div>
</body>
</html>
